name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      
      
      
      - name: Identify hanging API test
        timeout-minutes: 2
        run: |
          for test in \
            tests/test_api.py::test_health_endpoint \
            tests/test_api.py::test_predict_endpoint \
            tests/test_api.py::test_ready_endpoint \
            tests/test_api.py::test_startup_fails_when_model_cannot_load \
            tests/test_api.py::test_metrics_endpoint_starts_with_zero_counters
          do
            echo "=== Running $test ==="
            timeout 15s uv run pytest -vv -s "$test" --tb=short || {
              code=$?
              echo "Test failed or timed out: $test (exit $code)"
              exit "$code"
            }
          done
