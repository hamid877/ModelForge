name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      
      
      - name: Test API
        timeout-minutes: 1
        run: uv run pytest -vv -s tests/test_api.py --tb=short

      - name: Test core modules
        timeout-minutes: 1
        run: uv run pytest -vv -s tests/test_config.py tests/test_data_loader.py tests/test_data_pipeline.py tests/test_data_validator.py tests/test_drift.py --tb=short

      - name: Test MLflow and workflow
        timeout-minutes: 1
        run: uv run pytest -vv -s tests/test_registry.py tests/test_tracking.py tests/test_workflow.py tests/test_lifecycle.py --tb=short
