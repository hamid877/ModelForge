name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Diagnose test collection
        timeout-minutes: 1
        run: uv run pytest --collect-only -vv

      
      - name: Run tests without capture
        timeout-minutes: 2
        run: uv run pytest -vv -s --tb=short -o faulthandler_timeout=30

      - name: Run tests with one worker
        if: always()
        timeout-minutes: 2
        run: uv run pytest -vv -s --tb=short -o faulthandler_timeout=30 -x
