[project]
name = "modelforge"
version = "0.1.0"
description = "End-to-end machine learning platform"
readme = "README.md"
authors = [
    { name = "Mohd Hamid", email = "hamidmohd726@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]